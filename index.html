    <script>
      // Restore a deep link redirected by 404.html (GitHub Pages SPA fallback).
      (function () {
        var l = window.location;
        if (l.search && l.search.indexOf('?p=') === 0) {
          var params = new URLSearchParams(l.search);
          var p = params.get('p') || '/';
          var q = params.get('q');
          var base = l.pathname.replace(/\/$/, '');
          window.history.replaceState(null, '', base + p.replace(/~and~/g, '&') + (q ? '?' + q.replace(/~and~/g, '&') : '') + l.hash);
        }
      })();
    </script>
