name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium for scripts/prerender.mjs (static HTML for every route + sitemap.xml)
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          # Served at https://<user>.github.io/<repo>/ — remove this env if you use a custom domain.
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://federico-schwindt.github.io/portfolio-FEDERICOSCH
          # Neon (repo Settings → Secrets and variables → Actions → Variables). Empty = forms fall back to email.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}
          VITE_NEON_REALTIME_URL: ${{ vars.VITE_NEON_REALTIME_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
