<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Federico Schwindt</title>
    <script>
      // GitHub Pages SPA fallback: send the requested path to index.html as a query so the app can restore it.
      (function () {
        var segments = 1; // number of base-path segments (repo name)
        var l = window.location;
        var parts = l.pathname.split('/');
        var base = parts.slice(0, 1 + segments).join('/') + '/';
        var rest = parts.slice(1 + segments).join('/');
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '?p=/' + rest.replace(/&/g, '~and~') + (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
